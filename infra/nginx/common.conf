access_log /dev/stdout operational;
# Nginx request error logs include raw URIs/query values; use safe access status logs.
# Startup/config errors still go to the container stderr.
error_log /dev/null;
client_max_body_size 1m;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;

location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
location /static/ { alias /srv/static/; autoindex off; }
location /ws/ {
    limit_conn ws_per_ip 40;
    limit_conn_status 429;
    proxy_pass http://emergency_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}
location / {
    proxy_pass http://emergency_backend;
    proxy_set_header Host $host;
    # Overwrite client-supplied forwarding headers: Daphne is never public.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
}
