name: CI and EC2 deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: ers-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Source safety, dependencies, Docker build, checks and tests
        run: bash infra/ci.sh
      - name: Clean isolated CI containers
        if: always()
        run: |
          if [ -f .env ]; then docker compose down --volumes --remove-orphans; fi

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SHA: ${{ github.sha }}
      REPOSITORY: ${{ github.repository }}
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate deployment variables
        run: python3 infra/ssm_deploy.py --validate-only
      - name: Assume deployment role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ers-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: '920226265516'
          mask-aws-account-id: true
      - name: Deploy exact tested commit through SSM and verify HTTPS
        run: python3 infra/ssm_deploy.py
