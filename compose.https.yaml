# Optional final override after the domain/certificates exist.
services:
  nginx:
    ports: !override
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes: !override
      - ./infra/nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/common.conf:/etc/nginx/snippets/emergency.conf:ro
      - ./infra/nginx/upstream.conf:/etc/nginx/snippets/upstream.conf:ro
      - static_data:/srv/static:ro
      - ./infra/acme:/var/www/acme:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
